name: nightly
# Random-edit correctness on the public corpus with every edit family (text, environments,
# math, picture labels and coordinates, option numbers, preamble edits): every result the live
# path serves must equal the next clean pass. A new seed each night; run it by hand with a seed
# to reproduce one (crates/rtex-core/tests/mutation.rs documents the environment).
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (default: the run number)"
        required: false
      edits:
        description: "Edits per document"
        required: false
        default: "20"

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SEED: ${{ inputs.seed || github.run_number }}
      EDITS: ${{ inputs.edits || '20' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache TeX Live
        id: tl
        uses: actions/cache@v4
        with:
          path: build/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('scripts/install-texlive.sh', 'scripts/texlive.profile') }}
      - name: Install TeX Live
        if: steps.tl.outputs.cache-hit != 'true'
        run: scripts/install-texlive.sh
      - name: Write env
        run: |
          scripts/install-texlive.sh > /dev/null
          grep -v '^export PATH=' build/texlive.env | sed -e 's/^export //' -e 's/"//g' >> "$GITHUB_ENV"
          echo "$PWD/build/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - run: cargo test --release -p rtex-core --test mutation --no-run
      - name: Mutate the corpus
        run: |
          mkdir -p build/nightly
          status=0
          for d in fixtures/corpus/*/; do
            name=$(basename "$d")
            [ -f "$d/main.tex" ] || continue
            echo "::group::$name (seed $SEED, $EDITS edits)"
            if ! RTEX_MUTATION_PROJECT="$PWD/$d" RTEX_MUTATION_KINDS=all RTEX_MUTATION_EDITS="$EDITS" \
                RTEX_MUTATION_SEED="$SEED" RTEX_MUTATION_REPORT="$PWD/build/nightly/$name.json" \
                cargo test --release -p rtex-core --test mutation -- --nocapture \
                > "build/nightly/$name.txt" 2>&1; then
              status=1
              echo "::error title=mutation $name::seed $SEED: see build/nightly/$name.txt"
            fi
            cat "build/nightly/$name.txt"
            echo "::endgroup::"
            grep 'mutation summary' "build/nightly/$name.txt" | sed "s/^/$name: /" >> "$GITHUB_STEP_SUMMARY" || true
          done
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-mutation-${{ env.SEED }}
          path: build/nightly
